<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Promille Rechner – Stunden-Tabelle + Prediction</title>
  <style>
    :root{ --bg:#0b0b0b;--card:#151515;--text:#f2f2f2;--muted:#a9a9a9;--primary:#0a84ff;--danger:#d32f2f;--row:#1e1e1e;--radius:14px; }
    @media (prefers-color-scheme: light){ :root{--bg:#f7f7f7;--card:#fff;--text:#111;--muted:#666;--row:#f3f3f3} }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;padding:16px}
    .wrap{max-width:1100px;margin:0 auto}
    h1{font-size:1.4rem;margin:4px 2px 12px}
    .card{background:var(--card);border-radius:var(--radius);padding:14px;box-shadow:0 1px 2px rgba(0,0,0,.08);margin-bottom:12px}
    label{display:flex;align-items:center;gap:8px;margin:6px 8px 6px 0;flex-wrap:wrap}
    input,select,button{font-size:1rem;padding:10px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:#111;color:var(--text)}
    @media (prefers-color-scheme: light){input,select,button{background:#fff;color:var(--text);border:1px solid rgba(0,0,0,.14)}}
    button{cursor:pointer;min-height:40px}
    .btn{background:var(--primary);color:#fff;border:none}
    .btn-ghost{background:transparent;color:var(--text)}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
    .muted{color:var(--muted)}
    .prom{font-size:1.8rem;font-weight:800;margin:8px 2px 6px}
    .warn{background:#8b1c1c;color:#fff;padding:10px;border-radius:12px;margin:8px 0;display:none}
    table{width:100%;border-collapse:separate;border-spacing:0 8px}
    thead th{font-weight:600;text-align:left;padding:6px 8px;opacity:.85}
    tbody tr{background:var(--row);border-radius:12px}
    tbody td{padding:8px 10px;vertical-align:middle}
    .hourhead{white-space:nowrap}
    .chips{display:flex;gap:6px;flex-wrap:wrap}
    .chip{padding:8px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:transparent}
    .sum,.bac{min-width:80px;text-align:right;font-variant-numeric:tabular-nums}
    .pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.06);border-radius:999px;padding:4px 8px;margin:4px 6px 0 0}
    .pill select{padding:4px 8px;border-radius:8px}
    .pill button{min-height:auto;padding:4px 8px;border-radius:8px}
    #err{position:fixed;left:8px;right:8px;bottom:8px;background:#400;padding:10px 12px;border:1px solid #f88;color:#fff;border-radius:10px;display:none;z-index:9999;font-size:14px;white-space:pre-wrap}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Promille Rechner – Stunden-Tabelle (Bier/Radler) + Prediction</h1>

    <div class="card grid">
      <label>Gewicht
        <input aria-label="Gewicht in kg" type="number" id="gewicht" min="40" max="200" value="70" style="width:120px"> kg
      </label>
      <label>Geschlecht
        <select id="geschlecht"><option value="m">männlich</option><option value="w">weiblich</option></select>
      </label>
      <label>Abbau pro Stunde
        <input aria-label="Abbaurate in Promille pro Stunde" type="number" id="abbau" step="0.01" min="0.05" max="0.2" value="0.12" style="width:120px"> ‰/h
      </label>
      <label>Startzeit
        <input type="datetime-local" id="start">
      </label>
    </div>

    <div class="prom" id="anzeige">Aktuelle Promille: 0,000‰</div>
    <div class="muted" id="eta"></div>
    <div id="warn" class="warn">Achtung: Über 0,5‰ – nicht fahren!</div>

    <div class="card">
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px">
        <b>Stunden-Übersicht</b>
        <button class="btn-ghost" id="addHour" type="button">+ Stunde hinzufügen</button>
        <button class="btn-ghost" id="resetData" type="button">Alles löschen</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>Stunde</th>
            <th>Bier</th>
            <th>Radler</th>
            <th class="sum">Bier (L)</th>
            <th class="sum">Radler (L)</th>
            <th class="sum">Gramm Alkohol</th>
            <th class="bac">Jetzt</th>
            <th class="bac">Ende d. Stunde</th>
            <th>Einträge</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

  <div id="err"></div>

<script>
/* Fehleranzeige (hilft bei GitHub Pages Debug) */
window.addEventListener('error', e => {
  const el = document.getElementById('err');
  el.style.display='block';
  el.textContent = 'JS-Fehler: ' + (e.message||'') + '\\n' + (e.filename||'') + ':' + (e.lineno||'') + ':' + (e.colno||'');
});

/* Zeit-Helfer (lokal, kein UTC-Drift) */
function floorToHourLocal(d = new Date()){ const x = new Date(d); x.setMinutes(0,0,0); return x.getTime(); }
function toDatetimeLocalValue(ms){ const d=new Date(ms),p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; }
function fromDatetimeLocalValue(val){ const [YMD,HM]=val.split('T'); const [y,m,dd]=YMD.split('-').map(Number); const [h,mm]=HM.split(':').map(Number); return new Date(y,m-1,dd,h,mm,0,0).getTime(); }

/* Konstanten */
const DICHTE_ALK = 0.789; // g/cm³
const VOL_BIER   = 0.05;  // 5 %
const VOL_RADLER = 0.025; // 2.5 %
const R_M = 0.68, R_F = 0.55;
const NF3 = new Intl.NumberFormat('de-DE',{minimumFractionDigits:3,maximumFractionDigits:3});
const NF2 = new Intl.NumberFormat('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2});
const NF1 = new Intl.NumberFormat('de-DE',{minimumFractionDigits:1,maximumFractionDigits:1});

/* State + Persistenz */
let model = { gewicht:70, geschlecht:'m', abbau:0.12, startMs:null, hours:[] }; // hours: [{startMs,drinks:[{id,ty,volL}]}]
try{ const saved = JSON.parse(localStorage.getItem('prs_hours_table_predict')||'null'); if(saved && saved.hours) model = saved; }catch{}
function save(){ localStorage.setItem('prs_hours_table_predict', JSON.stringify(model)); }

/* Stundenaufbau */
function ensureStart(){ if(!model.startMs){ model.startMs = floorToHourLocal(); } }
function buildHoursUntilNow(){
  ensureStart();
  const hours=[]; let cur = model.startMs; const now = Date.now();
  while (cur <= now){
    const existing = model.hours.find(h => h.startMs === cur);
    hours.push(existing || { startMs:cur, drinks:[] });
    const d = new Date(cur); d.setHours(d.getHours()+1,0,0,0); cur = d.getTime();
  }
  model.hours = hours; save();
}

/* Rechenhilfen */
function alkoholGramm(liter, vol){ return liter * vol * 1000 * DICHTE_ALK; }
function sumsForHour(h){
  let bier=0, radler=0;
  (h.drinks||[]).forEach(d => { if(d.ty==='bier') bier+=d.volL; else radler+=d.volL; });
  const grams = alkoholGramm(bier, VOL_BIER) + alkoholGramm(radler, VOL_RADLER);
  return {bier, radler, grams};
}

/* BAC-Serie: für jede Stunde (vergangen/aktuell/zukünftig) den Wert am Ende der Stunde
   plus für die aktuelle Stunde zusätzlich den Live-Wert „jetzt“. */
function computeBACSeries(){
  const kg = model.gewicht||70;
  const r  = model.geschlecht==='w'? R_F : R_M;
  const ab = model.abbau||0.12; // ‰/h
  const now = Date.now();

  let prom = 0; // Start-Promille vor erster Stunde
  const rows = [];

  for (let i=0;i<model.hours.length;i++){
    const h = model.hours[i];
    const start = h.startMs;
    const end   = new Date(start).setHours(new Date(start).getHours()+1);

    // Intake der Stunde
    const {bier,radler,grams} = sumsForHour(h);
    prom += grams / (kg * r);

    if (now >= end){
      // Vergangenheit: tatsächlicher Endwert
      prom = Math.max(0, prom - ab);
      rows.push({ idx:i, now:null, end:prom, past:true });
      continue;
    }

    if (now >= start && now < end){
      const frac = (now - start)/3600000;
      const nowVal = Math.max(0, prom - ab*frac);
      const endVal = Math.max(0, prom - ab);      // Prognose: Ende dieser Stunde
      rows.push({ idx:i, now:nowVal, end:endVal, past:false, current:true });
      // Für weitere (zukünftige) Stunden nehmen wir als Ausgangsbasis den prognostizierten Endwert
      prom = endVal;
      continue;
    }

    // Zukunft: Prognose Ende der Stunde
    const endVal = Math.max(0, prom - ab);
    rows.push({ idx:i, now:null, end:endVal, past:false, future:true });
    prom = endVal;
  }
  return rows;
}

/* DOM refs */
const elGew = document.getElementById('gewicht');
const elSex = document.getElementById('geschlecht');
const elAbbau = document.getElementById('abbau');
const elStart = document.getElementById('start');
const elBody = document.getElementById('tbody');
const elProm = document.getElementById('anzeige');
const elEta  = document.getElementById('eta');
const elWarn = document.getElementById('warn');

/* Events (statisch) */
elGew.addEventListener('change', ()=>{ model.gewicht = clamp(+elGew.value,40,200); save(); recalc(); });
elSex.addEventListener('change', ()=>{ model.geschlecht = elSex.value; save(); recalc(); });
elAbbau.addEventListener('change', ()=>{ model.abbau = clamp(+elAbbau.value,0.05,0.2); save(); recalc(); });
elStart.addEventListener('change', ()=>{ model.startMs = fromDatetimeLocalValue(elStart.value); save(); buildHoursUntilNow(); renderTable(); recalc(); });
document.getElementById('addHour').addEventListener('click', ()=>{ addHourAtEnd(); renderTable(); recalc(); });
document.getElementById('resetData').addEventListener('click', ()=>{ if(confirm('Alle Eingaben löschen?')){ localStorage.removeItem('prs_hours_table_predict'); location.reload(); } });

/* Event-Delegation für dynamische Buttons/Selects */
elBody.addEventListener('click', (e)=>{
  const btn = e.target.closest('button');
  if(!btn) return;

  if(btn.dataset.add){ // + Getränk
    const i = +btn.dataset.i; const ty = btn.dataset.add; const vol = parseFloat(btn.dataset.vol);
    const h = model.hours[i]; if(!h) return;
    h.drinks.push({ id: uid(), ty, volL: vol });
    save(); refreshRow(i); recalc(); return;
  }
  if(btn.dataset.del){ // Eintrag löschen
    const i = +btn.dataset.i; const id = btn.dataset.del;
    const h = model.hours[i]; if(!h) return;
    h.drinks = (h.drinks||[]).filter(d => d.id !== id);
    save(); refreshRow(i); recalc(); return;
  }
  if(btn.dataset.delh){ // Stunde löschen
    const i = +btn.dataset.delh;
    model.hours.splice(i,1); save(); renderTable(); recalc(); return;
  }
});
elBody.addEventListener('change', (e)=>{
  const sel = e.target.closest('select');
  if(!sel || !sel.dataset.edit) return;
  const i = +sel.dataset.i; const id = sel.dataset.edit;
  const h = model.hours[i]; if(!h) return;
  const d = (h.drinks||[]).find(x => x.id === id); if(!d) return;
  d.volL = parseFloat(sel.value);
  save(); refreshRow(i); recalc();
});

/* Render */
function renderTable(){
  elBody.innerHTML='';
  const series = computeBACSeries(); // für Prediction-Spalten
  model.hours.forEach((h, idx)=>{
    const d = new Date(h.startMs);
    const {bier,radler,grams} = sumsForHour(h);
    const sRow = series.find(r => r.idx===idx) || {now:null,end:null};

    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="hourhead">${d.toLocaleString('de-DE',{weekday:'short', hour:'2-digit'})} Uhr</td>
      <td>
        <div class="chips">
          <button class="chip" data-add="bier" data-vol="0.3" data-i="${idx}" type="button">+ 0,3 L</button>
          <button class="chip" data-add="bier" data-vol="0.4" data-i="${idx}" type="button">+ 0,4 L</button>
          <button class="chip" data-add="bier" data-vol="0.5" data-i="${idx}" type="button">+ 0,5 L</button>
        </div>
      </td>
      <td>
        <div class="chips">
          <button class="chip" data-add="radler" data-vol="0.3" data-i="${idx}" type="button">+ 0,3 L</button>
          <button class="chip" data-add="radler" data-vol="0.4" data-i="${idx}" type="button">+ 0,4 L</button>
          <button class="chip" data-add="radler" data-vol="0.5" data-i="${idx}" type="button">+ 0,5 L</button>
        </div>
      </td>
      <td class="sum" id="sb${idx}">${bier.toFixed(1).replace('.',',')}</td>
      <td class="sum" id="sr${idx}">${radler.toFixed(1).replace('.',',')}</td>
      <td class="sum" id="sg${idx}">${NF1.format(grams)}</td>
      <td class="bac" id="bnow${idx}">${sRow.now!=null ? NF2.format(sRow.now)+'‰' : '–'}</td>
      <td class="bac" id="bend${idx}">${sRow.end!=null ? NF2.format(sRow.end)+'‰' : '–'}</td>
      <td id="list${idx}"></td>
      <td><button class="btn-ghost" data-delh="${idx}" type="button">Stunde löschen</button></td>
    `;
    elBody.appendChild(tr);
    renderPills(idx);
  });
}
function renderPills(i){
  const h = model.hours[i]; const box = document.getElementById('list'+i);
  box.innerHTML='';
  if(!h.drinks || !h.drinks.length){ box.innerHTML = '<span class="muted">–</span>'; return; }
  h.drinks.forEach(d=>{
    const pill = document.createElement('span'); pill.className='pill';
    const typeLabel = d.ty==='bier'?'Bier':'Radler';
    pill.innerHTML = `
      <span>${typeLabel}</span>
      <select data-edit="${d.id}" data-i="${i}">
        <option value="0.3"${d.volL===0.3?' selected':''}>0,3 L</option>
        <option value="0.4"${d.volL===0.4?' selected':''}>0,4 L</option>
        <option value="0.5"${d.volL===0.5?' selected':''}>0,5 L</option>
      </select>
      <button class="btn-ghost" data-del="${d.id}" data-i="${i}" type="button">✕</button>
    `;
    box.appendChild(pill);
  });
}
function refreshRow(i){
  const h = model.hours[i];
  const {bier,radler,grams} = sumsForHour(h);
  const sb = document.getElementById('sb'+i);
  const sr = document.getElementById('sr'+i);
  const sg = document.getElementById('sg'+i);
  if(sb) sb.textContent = bier.toFixed(1).replace('.',',');
  if(sr) sr.textContent = radler.toFixed(1).replace('.',',');
  if(sg) sg.textContent = NF1.format(grams);

  // BAC cells aktualisieren
  const sRow = computeBACSeries().find(r => r.idx===i);
  const bnow = document.getElementById('bnow'+i);
  const bend = document.getElementById('bend'+i);
  if(bnow) bnow.textContent = sRow && sRow.now!=null ? NF2.format(sRow.now)+'‰' : '–';
  if(bend) bend.textContent = sRow && sRow.end!=null ? NF2.format(sRow.end)+'‰' : '–';

  renderPills(i);
}

/* Stunde anhängen */
function addHourAtEnd(){
  const last = model.hours[model.hours.length-1];
  const base = last ? last.startMs : model.startMs;
  const d = new Date(base); d.setHours(d.getHours()+1,0,0,0);
  model.hours.push({ startMs:d.getTime(), drinks:[] });
  save();
}

/* Live-BAC (separat für Header) */
function computeBACNow(){
  const kg = model.gewicht||70;
  const r  = model.geschlecht==='w'? R_F : R_M;
  const ab = model.abbau||0.12; // ‰/h
  const now = Date.now();
  let prom = 0;

  for(let i=0;i<model.hours.length;i++){
    const h = model.hours[i];
    const start = h.startMs;
    const end   = new Date(start).setHours(new Date(start).getHours()+1);
    const {bier,radler} = sumsForHour(h);
    const grams = alkoholGramm(bier, VOL_BIER) + alkoholGramm(radler, VOL_RADLER);
    prom += grams / (kg * r);

    if (now >= start && now < end){
      const frac = (now - start)/3600000;
      prom = Math.max(0, prom - ab*frac);
      break;
    }
    if (now >= end){
      prom = Math.max(0, prom - ab);
    }
  }
  return Math.max(0, prom);
}

/* Anzeige */
function recalc(){
  document.getElementById('gewicht').value = model.gewicht;
  document.getElementById('geschlecht').value = model.geschlecht;
  document.getElementById('abbau').value = model.abbau;
  document.getElementById('start').value = toDatetimeLocalValue(model.startMs);

  const p = computeBACNow();
  elProm.textContent = `Aktuelle Promille: ${NF3.format(p)}‰`;
  elWarn.style.display = p >= 0.5 ? 'block' : 'none';

  const ab = model.abbau||0.12;
  const eta05 = p>0.5? (p-0.5)/ab : null;
  const eta00 = p/ab;
  elEta.textContent = `Unter 0,5‰ in ${eta05!==null? NF1.format(eta05)+' h' : '–'} · 0,0‰ in ${NF1.format(eta00)} h`;

  // ganze Tabelle neu (damit Prediction-Zellen mitlaufen)
  renderTable();
}

/* Utils */
function clamp(v,min,max){ return isFinite(v)? Math.max(min,Math.min(max,v)) : min; }
function uid(){ return (crypto?.randomUUID?.() || ('id-'+Math.random().toString(36).slice(2)+Date.now().toString(36))); }

/* Init */
(function init(){
  ensureStart();
  buildHoursUntilNow();
  renderTable();
  recalc();
  setInterval(()=>{ buildHoursUntilNow(); recalc(); }, 60000); // minütlich: Progress/Prediction aktualisieren
})();
</script>
</body>
</html>
